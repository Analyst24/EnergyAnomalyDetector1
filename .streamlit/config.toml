[server]
headless = true
address = "0.0.0.0"
port = 5000
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 200
runOnSave = false

[browser]
gatherUsageStats = false
serverAddress = "localhost"
serverPort = 5000

[theme]
base = "dark"
primaryColor = "#0D6EFD"
backgroundColor = "#1E1E1E"
secondaryBackgroundColor = "#252525"
textColor = "#FAFAFA"
font = "sans serif"

[ui]
suppressWarning = true
